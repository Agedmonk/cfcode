name: 同步install.js的版本号

on:
  push:
    branches:
      - main
    paths:
      # 只有当 JS 文件发生变动时，才触发此工作流
      - 'install.js'

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and update version.json
        run: |
          # 使用 grep 和正则从 JS 文件中提取 CURRENT_VERSION 的值
          # 【注意】如果你的 JS 文件名不是 Cloudflare自动部署.js，请修改下方的文件名
          JS_FILE="Cloudflare自动部署.js"
          
          if [ ! -f "$JS_FILE" ]; then
            echo "错误: 找不到文件 $JS_FILE"
            exit 1
          fi

          # 提取双引号内的版本号
          EXTRACTED_VERSION=$(grep -oP 'const CURRENT_VERSION\s*=\s*"\K[^"]+' "$JS_FILE" | head -n 1)
          
          if [ -z "$EXTRACTED_VERSION" ]; then
            echo "错误: 在 $JS_FILE 中找不到 CURRENT_VERSION 定义"
            exit 1
          fi
          
          echo "成功提取到版本号: $EXTRACTED_VERSION"
          
          # 覆写 version.json
          echo "{\"version\": \"$EXTRACTED_VERSION\"}" > version.json

      - name: Commit and push changes
        run: |
          # 配置机器人的 Git 信息
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add version.json
          
          # 检查 version.json 是否真的发生了改变
          if ! git diff --staged --quiet; then
            # 使用提取到的版本号作为提交信息
            git commit -m "chore: 同步install.js版本为 v$EXTRACTED_VERSION"
            git push
            echo "已将 version.json 更新至 v$EXTRACTED_VERSION 并推送"
          else
            echo "版本号未变动，无需提交"
          fi
