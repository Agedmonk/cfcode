name: 版本同步与打包发布

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'install.js'
      - 'bpb.js'
      - 'douding.js'
      - 'doudingusage.js'
      - 'getnodes.js'
      - 'getnodes_old.js'
      - 'mirror.js'
      - 'order.js'
      - 'cfnext.js'
      - 'next.js'
      - 'version.json'
  workflow_dispatch:

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查变动文件
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "changed_files=$(git ls-files | tr '\n' ' ')" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed_files=$(git ls-files | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            echo "changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi

      - name: 提取版本号并同步到仓库 (当 install.js 变动或手动触发时)
        run: |
          CHANGED="${{ steps.changes.outputs.changed_files }}"
          
          # 仅在手动执行或 install.js 发生变动时提取版本
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || echo "$CHANGED" | grep -qw "install.js"; then
            JS_FILE="install.js"
            if [ ! -f "$JS_FILE" ]; then
              echo "错误: 找不到文件 $JS_FILE"
              exit 1
            fi

            EXTRACTED_VERSION=$(grep -oP 'const CURRENT_VERSION\s*=\s*"\K[^"]+' "$JS_FILE" | head -n 1)
            if [ -z "$EXTRACTED_VERSION" ]; then
              echo "错误: 找不到 CURRENT_VERSION"
              exit 1
            fi
            
            echo "成功提取到版本号: $EXTRACTED_VERSION"
            echo "{\"version\": \"$EXTRACTED_VERSION\"}" > version.json

            # 生成仓库内自用的 install.zip
            zip -q install.zip install.js

            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add version.json install.zip
            
            if ! git diff --staged --quiet; then
              git commit -m "已同步版本至 v$EXTRACTED_VERSION 并打包压缩 [skip ci]"
              git pull --rebase origin main
              git push
              echo "✅ 版本更新与仓库同步已完成！"
            else
              echo "version.json 与 install.zip 无实质变动，跳过提交"
            fi
          else
            echo "install.js 未变动，跳过版本提取步骤"
          fi

      - name: 生成 Release 专用的 ZIP 文件并准备附件列表
        id: package
        run: |
          declare -A file_map=(
            ["_worker.js"]="worker.zip"
            ["install.js"]="install.zip"
            ["douding.js"]="douding.zip"
            ["doudingusage.js"]="doudingusage.zip"
            ["getnodes.js"]="getnodes.zip"
            ["getnodes_old.js"]="getnodes_old.zip"
            ["mirror.js"]="mirror.zip"
            ["order.js"]="order.zip"
            ["cfnext.js"]="cfnext.zip"
          )

          UPLOAD_LIST=""
          CHANGED="${{ steps.changes.outputs.changed_files }}"

          # 清理上一步可能残留在工作区的 install.zip，避免 zip 追加导致包内同时存在 install.js 和 _worker.js
          rm -f install.zip

          pack_zip() {
            local src_file=$1
            local zip_name=$2
            mkdir -p temp_build_dir
            cp "$src_file" "temp_build_dir/_worker.js"
            (cd temp_build_dir && zip -q "../$zip_name" "_worker.js")
            rm -rf temp_build_dir
          }

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "触发方式: 手动执行 - 打包全部 ZIP"
            for js_file in "${!file_map[@]}"; do
              if [ -f "$js_file" ]; then
                pack_zip "$js_file" "${file_map[$js_file]}"
                UPLOAD_LIST="$UPLOAD_LIST ${file_map[$js_file]}"
              fi
            done
          else
            echo "触发方式: 自动触发 - 仅打包变动的文件"
            for js_file in "${!file_map[@]}"; do
              if echo "$CHANGED" | grep -qw "$js_file"; then
                if [ -f "$js_file" ]; then
                  pack_zip "$js_file" "${file_map[$js_file]}"
                  UPLOAD_LIST="$UPLOAD_LIST ${file_map[$js_file]}"
                fi
              fi
            done
          fi

          # 附加源文件与刚才更新好的最新 version.json
          for raw_file in "install.js" "_worker.js" "cfnext.js" "next.js" "version.json"; do
            if [ -f "$raw_file" ]; then
              echo "发现 $raw_file，添加到发布列表。"
              UPLOAD_LIST="$UPLOAD_LIST $raw_file"
            fi
          done

          UPLOAD_LIST=$(echo $UPLOAD_LIST | xargs)

          if [ -z "$UPLOAD_LIST" ]; then
            echo "has_assets=false" >> $GITHUB_OUTPUT
          else
            echo "has_assets=true" >> $GITHUB_OUTPUT
            echo "UPLOAD_LIST=$UPLOAD_LIST" >> $GITHUB_ENV
          fi

      - name: 发布 1/2：推送到【当前仓库】的 Release
        if: steps.package.outputs.has_assets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          RELEASE_NAME="自动打包最新版本"
          
          if ! gh release view $TAG_NAME &>/dev/null; then
            gh release create $TAG_NAME $UPLOAD_LIST \
              --title "$RELEASE_NAME" \
              --notes "内部构建生成的最新 ZIP 压缩包。"
          else
            gh release upload $TAG_NAME $UPLOAD_LIST --clobber
          fi

      - name: 发布 2/2：推送到【新建的 public 仓库】的 Release
        if: steps.package.outputs.has_assets == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          TAG_NAME="latest"
          RELEASE_NAME="自动打包最新版本"
          TARGET_REPO="${{ github.repository_owner }}/public"
          
          if ! gh release view $TAG_NAME --repo $TARGET_REPO &>/dev/null; then
            gh release create $TAG_NAME $UPLOAD_LIST \
              --repo $TARGET_REPO \
              --title "$RELEASE_NAME" \
              --notes "公开分发：自动化构建生成的最新 ZIP 压缩包与版本信息。"
          else
            gh release upload $TAG_NAME $UPLOAD_LIST --repo $TARGET_REPO --clobber
          fi
