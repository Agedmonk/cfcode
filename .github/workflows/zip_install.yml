name: 打包install项目

# 触发条件：
on:
  # 1. 当推送到分支，并且包含对 install.js 的修改/创建时自动触发
  push:
    paths:
      - 'install.js'
  # 2. 允许在 GitHub 网页端手动触发此工作流
  workflow_dispatch:

jobs:
  build-and-zip:
    runs-on: ubuntu-latest
    
    # 明确授予 GITHUB_TOKEN 写入仓库的权限，以便能够推送生成的 zip 文件
    permissions:
      contents: write

    steps:
      # 1. 检出代码库
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. 将 install.js 打包为 install.zip
      - name: 创建压缩文件用于部署pages
        run: |
          zip install.zip install.js

      # 3. 将生成的 zip 文件提交并推送到当前仓库
      - name: 将压缩文件推送到当前仓库
        run: |
          # 配置 git 机器人账号信息
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 暂存生成的 zip 文件
          git add install.zip
          
          # 提交更改（如果文件没有任何内容变化，commit 会报错退出，因此使用 || echo 忽略报错，让流水线继续绿灯）
          git commit -m "自动执行打包install项目" || echo "No changes to commit"
          
          # 推送到当前分支
          git push
