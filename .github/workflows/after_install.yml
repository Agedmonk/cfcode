name: 构建install.js打包与版本同步

on:
  push:
    branches:
      - main
    paths:
      - 'install.js'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取版本号并更新 version.json
        run: |
          JS_FILE="install.js"
          if [ ! -f "$JS_FILE" ]; then
            echo "错误: 找不到文件 $JS_FILE"
            exit 1
          fi

          # 提取双引号内的版本号
          EXTRACTED_VERSION=$(grep -oP 'const CURRENT_VERSION\s*=\s*"\K[^"]+' "$JS_FILE" | head -n 1)
          
          if [ -z "$EXTRACTED_VERSION" ]; then
            echo "错误: 找不到 CURRENT_VERSION"
            exit 1
          fi
          
          echo "成功提取到版本号: $EXTRACTED_VERSION"
          echo "{\"version\": \"$EXTRACTED_VERSION\"}" > version.json
          echo "EXTRACTED_VERSION=$EXTRACTED_VERSION" >> $GITHUB_ENV

      - name: 打包 install.js
        run: |
          zip install.zip install.js

      - name: 提交并推送到当前仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 同时暂存 json 和 zip
          git add version.json install.zip
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: 同步版本至 v$EXTRACTED_VERSION 并打包压缩 [skip ci]"
            
            # 拉取最新代码防止冲突，然后推送
            git pull --rebase origin main
            git push
            echo "✅ 版本更新与打包均已完成并推送！"
          else
            echo "文件无实质变动，无需提交"
          fi
