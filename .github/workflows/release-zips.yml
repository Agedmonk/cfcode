name: 打包发布文件并推送到公开仓库

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'install.js'
      - 'douding.js'
      - 'doudingusage.js'
      - 'getnodes.js'
      - 'getnodes_old.js'
      - 'mirror.js'
  workflow_dispatch:

jobs:
  release-zips:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许向当前仓库的 Release 写入

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 ZIP 文件并准备附件列表
        id: package
        run: |
          declare -A file_map=(
            ["_worker.js"]="worker.zip"
            ["install.js"]="install.zip"
            ["douding.js"]="douding.zip"
            ["doudingusage.js"]="doudingusage.zip"
            ["getnodes.js"]="getnodes.zip"
            ["getnodes_old.js"]="getnodes_old.zip"
            ["mirror.js"]="mirror.zip"
          )

          UPLOAD_LIST=""

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "触发方式: 手动执行 - 打包全部 ZIP"
            for js_file in "${!file_map[@]}"; do
              if [ -f "$js_file" ]; then
                zip "${file_map[$js_file]}" "$js_file"
                UPLOAD_LIST="$UPLOAD_LIST ${file_map[$js_file]}"
              fi
            done
          else
            echo "触发方式: 自动触发 - 仅打包变动的文件"
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              changed_files=$(git ls-files)
            else
              changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            fi

            for js_file in "${!file_map[@]}"; do
              if echo "$changed_files" | grep -q "^$js_file$"; then
                if [ -f "$js_file" ]; then
                  zip "${file_map[$js_file]}" "$js_file"
                  UPLOAD_LIST="$UPLOAD_LIST ${file_map[$js_file]}"
                fi
              fi
            done
          fi

          # ================== 新增逻辑 ==================
          # 如果 _worker.js / version.json 存在，始终将其加入到上传列表中
          if [ -f "_worker.js" ]; then
            echo "发现 _worker.js，添加到发布列表。"
            UPLOAD_LIST="$UPLOAD_LIST _worker.js"
          fi
          
          if [ -f "version.json" ]; then
            echo "发现 version.json，添加到发布列表。"
            UPLOAD_LIST="$UPLOAD_LIST version.json"
          fi
          # ============================================

          UPLOAD_LIST=$(echo $UPLOAD_LIST | xargs)

          if [ -z "$UPLOAD_LIST" ]; then
            echo "has_assets=false" >> $GITHUB_OUTPUT
          else
            echo "has_assets=true" >> $GITHUB_OUTPUT
            echo "UPLOAD_LIST=$UPLOAD_LIST" >> $GITHUB_ENV
          fi

      - name: 发布 1/2：推送到【当前仓库】的 Release
        if: steps.package.outputs.has_assets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          RELEASE_NAME="自动打包最新版本"
          
          if ! gh release view $TAG_NAME &>/dev/null; then
            echo "当前仓库 Release 不存在，正在新建..."
            gh release create $TAG_NAME $UPLOAD_LIST \
              --title "$RELEASE_NAME" \
              --notes "内部构建生成的最新 ZIP 压缩包。"
          else
            echo "当前仓库 Release 已存在，正在覆盖更新..."
            gh release upload $TAG_NAME $UPLOAD_LIST --clobber
          fi

      - name: 发布 2/2：推送到【新建的 public 仓库】的 Release
        if: steps.package.outputs.has_assets == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          TAG_NAME="latest"
          RELEASE_NAME="自动打包最新版本"
          
          # 自动获取当前用户，拼接得到目标仓库名，如: Agedmonk/public
          TARGET_REPO="${{ github.repository_owner }}/public"
          
          if ! gh release view $TAG_NAME --repo $TARGET_REPO &>/dev/null; then
            echo "目标仓库 $TARGET_REPO Release 不存在，正在新建..."
            gh release create $TAG_NAME $UPLOAD_LIST \
              --repo $TARGET_REPO \
              --title "$RELEASE_NAME" \
              --notes "公开分发：自动化构建生成的最新 ZIP 压缩包与版本信息。"
          else
            echo "目标仓库 $TARGET_REPO Release 已存在，正在覆盖更新..."
            gh release upload $TAG_NAME $UPLOAD_LIST --repo $TARGET_REPO --clobber
          fi
